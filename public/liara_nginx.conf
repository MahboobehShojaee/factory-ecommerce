# Liara static app — SPA routing + caching (copied to dist/ on build)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.googletagmanager.com https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://flagcdn.com https://*.google.com https://*.googleusercontent.com; connect-src 'self' https://api.setarehkerman.com https://www.google-analytics.com https://region1.google-analytics.com https://www.clarity.ms https://*.clarity.ms; frame-src https://www.google.com; worker-src 'self' blob:; upgrade-insecure-requests" always;

location / {
  try_files $uri $uri/ /index.html;
}

location ~* \.(?:css|js|mjs|woff2?|ttf|eot)$ {
  expires 1y;
  access_log off;
  add_header Cache-Control "public, max-age=31536000, immutable";
}

location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|pdf)$ {
  expires 30d;
  access_log off;
  add_header Cache-Control "public, max-age=2592000";
}

location ~* \.(?:html?|xml|json)$ {
  expires -1;
  add_header Cache-Control "no-cache";
}
